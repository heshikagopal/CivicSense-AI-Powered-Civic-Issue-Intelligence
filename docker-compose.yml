version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: civicsense-db
    environment:
      POSTGRES_DB: civicsense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: civicsense-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/civicsense
      - SECRET_KEY=civicsense-production-secret-key-2026
      - UPLOAD_DIR=/app/backend/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/backend/uploads

volumes:
  postgres_data:
